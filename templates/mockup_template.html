<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · Dashboard mockup</title>
<!-- Generated by Agent 2 (Dashboard Designer). Numbers are embedded; charts use Apache ECharts. -->
<script src="__ECHARTS_URL__"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f2;
    --surface-1: #fcfcfb;
    --surface-2: #f0efec;
    --border: #e2e1dc;
    --grid: #ebeae6;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #77766f;
    --accent: #2a78d6;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
    --other: #a3a29c;
    --insight-bg: #eef4fc;
    --warn-bg: #fff4e0;
    --warn-text: #7a4b00;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #121211; --surface-1: #1a1a19; --surface-2: #232321; --border: #33332f; --grid: #2a2a27;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a998f; --accent: #3987e5;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --series-5: #d55181; --series-6: #0ca30c; --series-7: #9085e9; --series-8: #e66767;
      --other: #6b6a64; --insight-bg: #18263a; --warn-bg: #3a2c12; --warn-text: #f2c879;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #121211; --surface-1: #1a1a19; --surface-2: #232321; --border: #33332f; --grid: #2a2a27;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a998f; --accent: #3987e5;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #0ca30c; --series-7: #9085e9; --series-8: #e66767;
    --other: #6b6a64; --insight-bg: #18263a; --warn-bg: #3a2c12; --warn-text: #f2c879;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 20px 24px 0; max-width: 1400px; margin: 0 auto; }
  .topline { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .objective { color: var(--text-secondary); margin: 0; max-width: 900px; }
  .meta { color: var(--text-muted); font-size: 12px; margin-top: 6px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
           background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border); }
  button { font: inherit; cursor: pointer; }
  .btn { background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
         border-radius: 8px; padding: 6px 12px; }
  .btn:hover { border-color: var(--text-muted); }
  nav { display: flex; gap: 4px; overflow-x: auto; margin-top: 16px; border-bottom: 1px solid var(--border); }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px;
               color: var(--text-secondary); white-space: nowrap; }
  nav button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }
  main { max-width: 1400px; margin: 0 auto; padding: 20px 24px 48px; }
  .purpose { color: var(--text-secondary); margin: 0 0 14px; }
  .insight { background: var(--insight-bg); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; }
  .insight strong { display: block; margin-bottom: 4px; }
  .insight ul { margin: 4px 0; padding-left: 18px; }
  .insight .actions { color: var(--text-secondary); font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .kpi .label { color: var(--text-secondary); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .kpi .value { font-size: 26px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .def { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px;
          min-width: 0; }
  .card-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card h3 { font-size: 15px; margin: 0; }
  .card .sub { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .chart { height: 300px; width: 100%; }
  .card .why { color: var(--text-muted); font-size: 12px; margin: 6px 0 0; }
  .toggle { font-size: 12px; padding: 3px 8px; }
  .error { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 10px 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; background: var(--surface-1); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { max-height: 300px; overflow: auto; }
  code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2);
         padding: 2px 5px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; }
  .section-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
                  padding: 16px; margin-bottom: 16px; overflow-x: auto; }
  .status-ok { color: var(--text-primary); }
  .status-ok::before { content: "● "; color: var(--series-3); }
  .status-gap::before { content: "▲ "; color: var(--series-4); }
  .status-miss::before { content: "✕ "; color: var(--series-8); }
  footer { color: var(--text-muted); font-size: 12px; text-align: center; padding: 0 16px 24px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 600px) {
    header { padding: 16px 16px 0; } main { padding: 16px 16px 40px; }
    .kpi .value { font-size: 22px; }
  }
</style>
</head>
<body>
<header>
  <div class="topline">
    <div>
      <h1 id="title"></h1>
      <p class="objective" id="objective"></p>
      <div class="meta" id="meta"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="badge">Mockup · Step 2</span>
      <button class="btn" id="theme" type="button" aria-label="Toggle light or dark theme">◐ Theme</button>
    </div>
  </div>
  <nav id="tabs" role="tablist"></nav>
</header>
<main id="view"></main>
<footer id="footer"></footer>

<script>
const DATA = /*__DATA__*/null;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const CUR = DATA.currency || "₹";
const CHART_NAMES = { bar: "Bar", horizontal_bar: "Horizontal bar", line: "Line", pie: "Donut", table: "Table" };

function fmt(value, format, short) {
  if (value === null || value === undefined) return "–";
  if (format === "percent") return (value * 100).toFixed(1) + "%";
  if (format === "decimal") return value.toLocaleString("en-IN", { maximumFractionDigits: 2, minimumFractionDigits: 2 });
  if (format === "currency") {
    const a = Math.abs(value);
    if (a >= 1e7) return CUR + (value / 1e7).toFixed(short ? 1 : 2) + " Cr";
    if (a >= 1e5) return CUR + (value / 1e5).toFixed(short ? 1 : 2) + " L";
    if (short && a >= 1e3) return CUR + (value / 1e3).toFixed(0) + "K";
    return CUR + Math.round(value).toLocaleString("en-IN");
  }
  if (short && Math.abs(value) >= 1e5) return (value / 1e5).toFixed(1) + " L";
  return Math.round(value).toLocaleString("en-IN");
}

// ------------------------------------------------------------------ header + tabs
const project = DATA.project;
document.getElementById("title").textContent = project.name;
document.getElementById("objective").textContent = project.objective || "";
const filters = Object.entries(DATA.filters_applied || {});
document.getElementById("meta").textContent =
  `Generated ${DATA.generated_at} by ${DATA.generated_by}` +
  (filters.length ? ` · Filters: ${filters.map(([k, v]) => k + " = " + v.join(", ")).join(" · ")}` : " · All data (no filters)");
document.getElementById("footer").textContent =
  `${DATA.tech_stack.mockup.charting} · Data: ${DATA.tech_stack.data.engine} ${DATA.tech_stack.data.database} · ` +
  `Next: Step 3 builds this design in the chosen BI platform.`;

const TABS = [
  ...DATA.dashboards.map((b, i) => ({ id: "d" + i, label: b.name, render: () => renderBoard(b) })),
  { id: "formulas", label: "KPI formulas", render: renderFormulas },
  { id: "trace", label: "BRD traceability", render: renderTrace },
];
let current = null, charts = [];
const nav = document.getElementById("tabs");
TABS.forEach((t) => {
  const b = document.createElement("button");
  b.type = "button"; b.role = "tab"; b.textContent = t.label; b.dataset.id = t.id;
  b.addEventListener("click", () => show(t.id));
  nav.appendChild(b);
});
function show(id) {
  current = id;
  nav.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.id === id)));
  charts.forEach((c) => c.dispose()); charts = [];
  TABS.find((t) => t.id === id).render();
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
}

// ------------------------------------------------------------------ dashboard view
function renderBoard(board) {
  const kpiDefs = Object.fromEntries(DATA.kpi_catalog.map((k) => [k.id, k]));
  const view = document.getElementById("view");
  let html = board.purpose ? `<p class="purpose">${esc(board.purpose)}</p>` : "";
  if (board.insight && board.insight.headline) {
    html += `<div class="insight"><strong>✨ ${esc(board.insight.headline)}</strong><ul>` +
      board.insight.insights.map((i) => `<li>${esc(i)}</li>`).join("") + "</ul>" +
      (board.insight.recommendations.length ? `<div class="actions">Recommended: ${board.insight.recommendations.map(esc).join(" · ")}</div>` : "") +
      "</div>";
  }
  html += `<div class="kpis">` + board.kpis.map((k) =>
    `<div class="kpi" title="${esc(kpiDefs[k.metric]?.business_definition || "")}">
       <div class="label">${esc(k.label)}</div>
       <div class="value">${esc(k.display)}</div>
       <div class="def">${esc(kpiDefs[k.metric]?.brd_definition || kpiDefs[k.metric]?.business_definition || "")}</div>
     </div>`).join("") + `</div>`;
  html += `<div class="grid">` + board.charts.map((c, i) =>
    `<section class="card">
       <div class="card-head">
         <div><h3>${esc(c.title)}</h3>
           <div class="sub">${esc(c.metric)} by ${esc(c.dimension)} · ${CHART_NAMES[c.type] || c.type}${c.brd_refs.length ? " · " + esc(c.brd_refs.join(", ")) : ""}</div></div>
         ${c.type !== "table" && !c.error && typeof echarts !== "undefined" ? `<button class="btn toggle" type="button" data-i="${i}">Table</button>` : ""}
       </div>
       <div id="c${i}" class="${c.type === "table" || c.error ? "" : "chart"}"></div>
       ${c.rationale ? `<p class="why">${esc(c.rationale)}</p>` : ""}
     </section>`).join("") + `</div>`;
  view.innerHTML = html;
  board.charts.forEach((c, i) => drawChart(c, document.getElementById("c" + i)));
  view.querySelectorAll(".toggle").forEach((btn) => btn.addEventListener("click", () => {
    const c = board.charts[+btn.dataset.i], el = document.getElementById("c" + btn.dataset.i);
    const toTable = btn.textContent === "Table";
    const old = charts.find((x) => x.getDom() === el);
    if (old) { old.dispose(); charts = charts.filter((x) => x !== old); }
    el.className = toTable ? "" : "chart";
    btn.textContent = toTable ? "Chart" : "Table";
    toTable ? drawTable(c, el) : drawChart(c, el);
  }));
}

function drawTable(c, el) {
  el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>${esc(c.dimension)}</th><th style="text-align:right">${esc(c.metric)}</th></tr></thead><tbody>` +
    c.rows.map((r) => `<tr><td>${esc(r[0])}</td><td class="num">${esc(r[2])}</td></tr>`).join("") + "</tbody></table></div>";
}

function drawChart(c, el) {
  if (c.error) { el.innerHTML = `<div class="error">Query failed: ${esc(c.error)}</div>`; return; }
  if (!c.rows.length) { el.innerHTML = `<div class="error">No rows for this selection.</div>`; return; }
  if (c.type === "table" || typeof echarts === "undefined") {
    if (typeof echarts === "undefined" && c.type !== "table") {
      el.className = ""; el.insertAdjacentHTML("beforebegin", `<div class="sub">Charts need internet access (ECharts CDN); showing the table.</div>`);
    }
    return drawTable(c, el);
  }
  const chart = echarts.init(el, null, { renderer: "svg" });
  charts.push(chart);
  const text = css("--text-secondary"), muted = css("--text-muted"), grid = css("--grid"), surface = css("--surface-1");
  const series1 = css("--series-1");
  const cats = c.rows.map((r) => r[0]), vals = c.rows.map((r) => r[1]);
  const tooltip = {
    backgroundColor: surface, borderColor: css("--border"), textStyle: { color: css("--text-primary") },
    valueFormatter: (v) => fmt(v, c.format),
  };
  const valueAxis = {
    type: "value", axisLabel: { color: muted, formatter: (v) => fmt(v, c.format, true) },
    splitLine: { lineStyle: { color: grid } }, axisLine: { show: false },
  };
  const catAxis = { type: "category", data: cats, axisLabel: { color: text, hideOverlap: true },
                    axisLine: { lineStyle: { color: grid } }, axisTick: { show: false } };
  let option;
  if (c.type === "line") {
    option = {
      tooltip: { ...tooltip, trigger: "axis", axisPointer: { type: "line", lineStyle: { color: muted } } },
      grid: { left: 8, right: 16, top: 16, bottom: 8, containLabel: true },
      xAxis: { ...catAxis, boundaryGap: false }, yAxis: valueAxis,
      series: [{ type: "line", data: vals, name: c.metric, smooth: false, symbol: "circle", symbolSize: 8,
                 showSymbol: cats.length <= 24, lineStyle: { width: 2, color: series1 }, itemStyle: { color: series1 },
                 areaStyle: { color: series1, opacity: 0.08 } }],
    };
  } else if (c.type === "pie") {
    const slots = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => css("--series-" + n));
    let rows = c.rows;
    if (rows.length > 8) {  // fold the tail into "Other" instead of generating new hues
      const other = rows.slice(7).reduce((s, r) => s + (r[1] || 0), 0);
      rows = [...rows.slice(0, 7), ["Other", other]];
    }
    option = {
      tooltip: { ...tooltip, trigger: "item", formatter: (p) => `${esc(p.name)}<br><b>${fmt(p.value, c.format)}</b> (${p.percent}%)` },
      legend: { bottom: 0, textStyle: { color: text }, icon: "circle", itemWidth: 10, itemHeight: 10 },
      series: [{ type: "pie", radius: ["48%", "72%"], center: ["50%", "45%"], avoidLabelOverlap: true,
                 itemStyle: { borderColor: surface, borderWidth: 2 },
                 label: { color: text, formatter: "{d}%" },
                 data: rows.map((r, i) => ({ name: r[0], value: r[1],
                   itemStyle: { color: r[0] === "Other" ? css("--other") : slots[i] } })) }],
    };
  } else {
    const horizontal = c.type === "horizontal_bar";
    const bar = { type: "bar", data: vals, name: c.metric, barMaxWidth: 28,
                  itemStyle: { color: series1, borderRadius: horizontal ? [0, 4, 4, 0] : [4, 4, 0, 0] },
                  emphasis: { itemStyle: { opacity: 0.85 } } };
    if (cats.length <= 12) {
      bar.label = { show: true, position: horizontal ? "right" : "top", color: text, fontSize: 11,
                    formatter: (p) => fmt(p.value, c.format, true) };
    }
    option = {
      tooltip: { ...tooltip, trigger: "axis", axisPointer: { type: "shadow", shadowStyle: { opacity: 0.06 } } },
      grid: { left: 8, right: horizontal ? 48 : 16, top: 24, bottom: 8, containLabel: true },
      xAxis: horizontal ? { ...valueAxis } : { ...catAxis, axisLabel: { ...catAxis.axisLabel, hideOverlap: false, interval: 0,
              rotate: cats.length > 4 ? 30 : 0, width: 90, overflow: "truncate" } },
      yAxis: horizontal ? { ...catAxis, inverse: true, axisLabel: { ...catAxis.axisLabel, width: 140, overflow: "truncate" } } : valueAxis,
      series: [bar],
    };
  }
  chart.setOption(option);
}

// ------------------------------------------------------------------ formulas + traceability
function renderFormulas() {
  document.getElementById("view").innerHTML =
    `<p class="purpose">One definition per KPI. The same logic is used in the mockup (SQL), Tableau and Power BI (DAX).</p>
     <div class="section-card"><table><thead><tr><th>KPI</th><th>BRD definition</th><th>SQL (mockup)</th><th>Tableau</th><th>Power BI (DAX)</th><th>Format</th></tr></thead><tbody>` +
    DATA.kpi_catalog.map((k) => `<tr><td><b>${esc(k.label)}</b><div class="sub">${esc(k.id)}</div></td>
      <td>${esc(k.brd_definition || k.business_definition)}</td>
      <td><code>${esc(k.formulas.sql)}</code></td><td><code>${esc(k.formulas.tableau)}</code></td>
      <td><code>${esc(k.formulas.dax || "–")}</code></td><td>${esc(k.format)}</td></tr>`).join("") +
    `</tbody></table></div>`;
}

function renderTrace() {
  const cls = { charted: "status-ok", "kpi card": "status-ok", "mapped, not charted": "status-gap", unmapped: "status-miss" };
  document.getElementById("view").innerHTML =
    `<p class="purpose">Every requirement in the finalised BRD and where it appears in the mockup.</p>
     <div class="section-card"><table><thead><tr><th>Req.</th><th>Type</th><th>Requirement</th><th>BRD dashboard</th><th>Status</th><th>Mockup</th></tr></thead><tbody>` +
    DATA.traceability.map((t) => `<tr><td>${esc(t.ref || "–")}</td><td>${esc(t.type)}</td><td>${esc(t.requirement)}</td>
      <td>${esc(t.brd_dashboard)}</td><td class="${cls[t.status] || ""}">${esc(t.status)}</td><td>${esc(t.where || t.reason || "")}</td></tr>`).join("") +
    `</tbody></table></div>`;
}

// ------------------------------------------------------------------ theme + resize
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("mockup-theme", root.dataset.theme); } catch (e) {}
  show(current);
});
try { const saved = localStorage.getItem("mockup-theme"); if (saved) document.documentElement.dataset.theme = saved; } catch (e) {}
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => charts.forEach((c) => c.resize()), 120); });
const start = location.hash.slice(1);
show(TABS.some((t) => t.id === start) ? start : TABS[0].id);
</script>
</body>
</html>
